name: Generate Daily Plans v2

on:
  schedule:
    # Run every day at 00:00 UTC (02:00 Lisbon time)
    - cron: "0 0 * * *"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      member:
        description: "Specific member (leave empty for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - naydino
          - berlogabob
          - electricianv001

permissions:
  contents: write
  actions: write

jobs:
  generate-daily-plans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Install GitHub CLI
        run: |
          gh --version || sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Generate date stamp
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Generate plans for all members
        if: ${{ github.event.inputs.member == '' }}
        run: |
          python3 scripts/generate_daily_plan.py --all-members --output-dir reports/daily-plans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate plan for specific member
        if: ${{ github.event.inputs.member != '' }}
        run: |
          python3 scripts/generate_daily_plan.py \
            --member ${{ github.event.inputs.member }} \
            --output reports/daily-plan-${{ github.event.inputs.member }}.typ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile PDFs
        run: |
          cd reports/daily-plans
          for typ_file in *.typ; do
            pdf_file="${typ_file%.typ}.pdf"
            echo "Compiling $typ_file -> $pdf_file"
            typst compile "$typ_file" "$pdf_file" || echo "Warning: Failed to compile $typ_file"
          done
          ls -la *.pdf || echo "No PDFs generated"

      - name: Commit and push plans
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/daily-plans/
          git commit -m "📅 Auto-generate daily plans: ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-plans-pdf-${{ steps.date.outputs.date }}
          path: reports/daily-plans/*.pdf
          retention-days: 7

      - name: Upload TYP sources as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-plans-source-${{ steps.date.outputs.date }}
          path: reports/daily-plans/*.typ
          retention-days: 7

      - name: Send email notifications
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📅 Daily Plan - ${{ steps.date.outputs.date }} - The Oracle That Wears Us"
          to: |
            ${{ secrets.EMAIL_TO_NADINE }},
            ${{ secrets.EMAIL_TO_ANDREY }},
            ${{ secrets.EMAIL_TO_DMITRI }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            <html>
            <body>
              <h2>📅 Daily Plans Generated - ${{ steps.date.outputs.date }}</h2>
              
              <p>Your personalized daily plan is ready!</p>
              
              <h3>Team Member Plans:</h3>
              <table border="1" cellpadding="10">
                <tr>
                  <th>Member</th>
                  <th>Plan PDF</th>
                  <th>Issues</th>
                </tr>
                <tr>
                  <td>Nadine Allan</td>
                  <td><a href="https://github.com/berlogabob/Project02/blob/main/reports/daily-plans/daily-plan-naydino.pdf">Download PDF</a></td>
                  <td>See PDF</td>
                </tr>
                <tr>
                  <td>Andrey Dyakov</td>
                  <td><a href="https://github.com/berlogabob/Project02/blob/main/reports/daily-plans/daily-plan-berlogabob.pdf">Download PDF</a></td>
                  <td>See PDF</td>
                </tr>
                <tr>
                  <td>Dmitri Kazantsev</td>
                  <td><a href="https://github.com/berlogabob/Project02/blob/main/reports/daily-plans/daily-plan-electricianv001.pdf">Download PDF</a></td>
                  <td>See PDF</td>
                </tr>
              </table>
              
              <h3>How to Use Your Daily Plan:</h3>
              <ol>
                <li><strong>Download</strong> your personalized PDF</li>
                <li><strong>Review</strong> your assigned tasks</li>
                <li><strong>Check</strong> sub-issues and recent comments</li>
                <li><strong>Plan</strong> your time blocks</li>
                <li><strong>Update</strong> issues as you work</li>
                <li><strong>Comment</strong> your progress</li>
              </ol>
              
              <p><strong>Direct Links:</strong></p>
              <ul>
                <li><a href="https://github.com/berlogabob/Project02/tree/main/reports/daily-plans">All Plans</a></li>
                <li><a href="https://github.com/berlogabob/Project02/actions">Workflow Runs</a></li>
              </ul>
              
              <hr>
              <p><em>Auto-generated every day at 00:00 UTC (02:00 Lisbon)</em></p>
              <p><strong>Today's Focus:</strong> Make progress on your assigned issues and update the team! 💪</p>
            </body>
            </html>
          priority: high

name: Generate Weekly Report

on:
  schedule:
    # Run every Sunday at 22:00 UTC = Monday 00:00 Lisbon (UTC+2)
    # Report ready Monday morning for professor demo
    - cron: "0 22 * * 0"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      week_number:
        description: "Week number (e.g., 1, 2, 3)"
        required: true
        default: "1"
        type: string
      milestone:
        description: "Milestone name"
        required: true
        default: "1st milestone: Documentation"
        type: string

permissions:
  contents: write
  issues: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Install GitHub CLI
        run: |
          gh --version || sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Determine week number
        id: week
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "week=${{ inputs.week_number }}" >> $GITHUB_OUTPUT
            echo "milestone=${{ inputs.milestone }}" >> $GITHUB_OUTPUT
          else
            # Calculate current week number from project start (Feb 1, 2026)
            CURRENT_WEEK=$(python3 -c "from datetime import date; start=date(2026,2,1); today=date.today(); print(((today-start).days//7)+1)")
            echo "week=$CURRENT_WEEK" >> $GITHUB_OUTPUT
            echo "milestone=1st milestone: Documentation" >> $GITHUB_OUTPUT
          fi

      - name: Generate Typst report
        run: |
          python3 scripts/generate_weekly_report.py \
            --week ${{ steps.week.outputs.week }} \
            --milestone "${{ steps.week.outputs.milestone }}" \
            --output reports/week-${{ steps.week.outputs.week }}-report.typ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile to PDF
        run: |
          typst compile reports/week-${{ steps.week.outputs.week }}-report.typ reports/week-${{ steps.week.outputs.week }}-report.pdf

      - name: Commit and push report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/week-${{ steps.week.outputs.week }}-report.typ reports/week-${{ steps.week.outputs.week }}-report.pdf
          git commit -m "📊 Auto-generate weekly report: Week ${{ steps.week.outputs.week }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-week-${{ steps.week.outputs.week }}
          path: |
            reports/week-${{ steps.week.outputs.week }}-report.typ
            reports/week-${{ steps.week.outputs.week }}-report.pdf
          retention-days: 30

      - name: Create GitHub Release (for milestone weeks)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          files: reports/week-${{ steps.week.outputs.week }}-report.pdf
          tag_name: week-${{ steps.week.outputs.week }}-report
          name: "Weekly Report - Week ${{ steps.week.outputs.week }}"
          body: |
            ## Weekly Progress Report

            Auto-generated report for Week ${{ steps.week.outputs.week }}.

            ### Highlights
            - See attached PDF for full details
            - Generated: ${{ github.event.head_commit.timestamp }}

            ---
            *This report was automatically generated by GitHub Actions*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post summary to issue
        uses: actions/github-script@v7
        with:
          script: |
            const weekNum = '${{ steps.week.outputs.week }}';
            const milestone = '${{ steps.week.outputs.milestone }}';

            // Find or create weekly report issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weekly-report'
            });

            const reportIssue = issues.data.find(i => i.title.includes(`Week ${weekNum}`));

            if (reportIssue) {
              // Comment on existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: reportIssue.number,
                body: `## 📊 Week ${weekNum} Report Generated\n\nThe weekly report has been automatically generated.\n\n📄 [Download PDF](../../releases/download/week-${weekNum}-report/week-${weekNum}-report.pdf)\n\n---\n*Auto-generated by GitHub Actions*`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Weekly Report - Week ${weekNum}`,
                body: `## Weekly Progress Report\n\n**Week:** ${weekNum}\n**Milestone:** ${milestone}\n**Generated:** ${new Date().toISOString()}\n\n### Downloads\n- 📄 [PDF Report](../../releases/download/week-${weekNum}-report/week-${weekNum}-report.pdf)\n- 📝 [Typst Source](../../blob/main/reports/week-${weekNum}-report.typ)\n\n---\n*This report was automatically generated by GitHub Actions*\n\n@naydino @berlogabob @electricianv001`,
                labels: ['weekly-report', 'type: documentation', `milestone-${(parseInt(weekNum) - 1) % 3 + 1}`]
              });
            }

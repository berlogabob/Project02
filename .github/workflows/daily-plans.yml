name: Daily Plans Generator

on:
  schedule:
    # Run daily at 00:00 UTC (02:00 Lisbon time)
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      member:
        description: "Specific team member (leave empty for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - naydino
          - berlogabob
          - electricianv001

permissions:
  contents: write
  actions: read

jobs:
  generate-daily-plans:
    runs-on: ubuntu-latest
    env:
      DATE_PREFIX: ${{ steps.date.outputs.date }}
      DATE_READABLE: ${{ steps.date.outputs.date_readable }}
      DATE_FULL: ${{ steps.date.outputs.date_full }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate date stamps
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "date_readable=$(date +'%B %d')" >> "$GITHUB_OUTPUT"
          echo "date_full=$(date +'%B %d, %Y')" >> "$GITHUB_OUTPUT"
          echo "iso_date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create output directory
        run: mkdir -p reports/daily-plans

      # ============================================================
      # GENERATE PLAN FOR NADINE
      # ============================================================
      - name: Generate plan for Nadine
        if: github.event.inputs.member == '' || github.event.inputs.member == 'naydino'
        run: |
          USERNAME="naydino"
          FULL_NAME="Nadine Allan"
          OUTPUT_FILE="reports/daily-plans/${{ env.DATE_PREFIX }}-daily-plan-${USERNAME}.typ"

          echo "Generating daily plan for ${FULL_NAME} (@${USERNAME})"

          # Fetch open issues
          ISSUES=$(gh issue list --state open --assignee ${USERNAME} --limit 50 \
            --json number,title,labels,milestone,body --jq '.[]')

          # Count issues
          ISSUE_COUNT=$(echo "${ISSUES}" | jq -s 'length' <<< "${ISSUES}")
          if [ -z "${ISSUES}" ]; then
            ISSUE_COUNT=0
          fi

          # Count high priority
          HIGH_PRIORITY=$(echo "${ISSUES}" | jq -s '[.[] | select(.labels[].name | test("critical|high"))] | length' 2>/dev/null || echo "0")

          # Generate Typst file
          cat > "${OUTPUT_FILE}" << 'TEMPLATE_START'
// Daily Plan - Auto-generated
#import "../templates/daily-plan-template.typ": *

TEMPLATE_START

          cat >> "${OUTPUT_FILE}" << EOF
// Generated: ${{ env.DATE_PREFIX }}

#report_header("1")

#section_title("1", "${{ env.DATE_READABLE }}", "Daily Plan")

#table(
  columns: (1fr),
  inset: 12pt,
  stroke: none,
  fill: muted_bg,
  [
    #grid(
      columns: (1fr, 1fr),
      gutter: 15pt,
      [
        *Team Member:* \\ ${FULL_NAME} \\ #text(size: 8pt)[@${USERNAME}] \\ \\
        *Date:* \\ ${{ env.DATE_FULL }}
      ],
      [
        *Project:* \\ The Oracle That Wears Us \\ \\
        *Milestone:* \\ Varies by issue (see tasks)
      ]
    )
  ]
)

#v(2em)

== Your Tasks for Today

EOF

          if [ "${ISSUE_COUNT}" -eq 0 ] || [ -z "${ISSUES}" ]; then
            cat >> "${OUTPUT_FILE}" << 'NO_TASKS'
#box(
  width: 100%,
  inset: 20pt,
  fill: chapter_themes.at("3").accent.lighten(90%),
  radius: 4pt,
  align(center, [
    #text(size: 12pt)[🎉 No tasks assigned for today!]
    #v(8pt)
    #text(size: 9pt, fill: gray)[Use this time to explore, experiment, or help teammates]
  ])
)
NO_TASKS
          else
            # Write summary boxes
            cat >> "${OUTPUT_FILE}" << SUMMARY
#grid(
  columns: (1fr, 1fr, 1fr),
  gutter: 15pt,
  #box(
    fill: chapter_themes.at("1").accent.lighten(90%),
    inset: 12pt,
    radius: 4pt,
    align(center, [
      #text(size: 20pt, weight: "bold", fill: chapter_themes.at("1").accent)[${ISSUE_COUNT}]
      #text(size: 8pt)[Total Tasks]
    ])
  ),
  #box(
    fill: chapter_themes.at("2").accent.lighten(90%),
    inset: 12pt,
    radius: 4pt,
    align(center, [
      #text(size: 20pt, weight: "bold", fill: chapter_themes.at("2").accent)[${HIGH_PRIORITY}]
      #text(size: 8pt)[High Priority]
    ])
  ),
  #box(
    fill: chapter_themes.at("3").accent.lighten(90%),
    inset: 12pt,
    radius: 4pt,
    align(center, [
      #text(size: 20pt, weight: "bold", fill: chapter_themes.at("3").accent)[${{ env.DATE_READABLE }}]
      #text(size: 8pt)[Date]
    ])
  )
)

#v(2em)

== Priority Tasks
#line(length: 100%, stroke: 1pt + chapter_themes.at("2").accent)
#v(10pt)

SUMMARY

            # Process priority issues (critical/high)
            echo "${ISSUES}" | jq -s '.[] | select(.labels[].name | test("critical|high"))' 2>/dev/null | while read -r issue; do
              if [ -n "${issue}" ]; then
                NUM=$(echo "${issue}" | jq -r '.number')
                TITLE=$(echo "${issue}" | jq -r '.title' | sed 's/\[/(/g; s/\]/)/g' | head -c 200)
                BODY=$(echo "${issue}" | jq -r '.body // ""' | sed 's/!\[[^]]*\]([^)]*)/[IMAGE_PLACEHOLDER]/g; s/\[/(/g; s/\]/)/g' | head -c 300)
                PRIORITY="critical"
                MS=$(echo "${issue}" | jq -r '.milestone.title // "None"')
                LABELS=$(echo "${issue}" | jq -r '[.labels[].name] | join(", ")')

                cat >> "${OUTPUT_FILE}" << ISSUE_CARD
#issue_card(${NUM}, [${TITLE}], "${PRIORITY}", [${BODY}...], [${MS}], [${LABELS}])

ISSUE_CARD
              fi
            done

            cat >> "${OUTPUT_FILE}" << 'MID_SECTION'

#v(2em)

== All Tasks
#line(length: 100%, stroke: 1pt + chapter_themes.at("1").accent)
#v(10pt)

MID_SECTION

            # Process remaining issues
            echo "${ISSUES}" | jq -s '.[] | select(.labels[].name | test("critical|high") | not)' 2>/dev/null | while read -r issue; do
              if [ -n "${issue}" ]; then
                NUM=$(echo "${issue}" | jq -r '.number')
                TITLE=$(echo "${issue}" | jq -r '.title' | sed 's/\[/(/g; s/\]/)/g' | head -c 200)
                BODY=$(echo "${issue}" | jq -r '.body // ""' | sed 's/!\[[^]]*\]([^)]*)/[IMAGE_PLACEHOLDER]/g; s/\[/(/g; s/\]/)/g' | head -c 300)
                PRIORITY=$(echo "${issue}" | jq -r '.labels[].name' | grep -E "medium|low" | head -1 || echo "")
                MS=$(echo "${issue}" | jq -r '.milestone.title // "None"')
                LABELS=$(echo "${issue}" | jq -r '[.labels[].name] | join(", ")')

                cat >> "${OUTPUT_FILE}" << ISSUE_CARD
#issue_card(${NUM}, [${TITLE}], "${PRIORITY}", [${BODY}...], [${MS}], [${LABELS}])

ISSUE_CARD
              fi
            done
          fi

          # Add footer sections
          cat >> "${OUTPUT_FILE}" << 'FOOTER'

#v(2em)

#box(
  width: 100%,
  inset: 15pt,
  fill: muted_bg,
  radius: 4pt,
  [
    #text(size: 9pt)[
      1. *Review* each task and its comments \\
      2. *Check* recent updates \\
      3. *Estimate* time needed \\
      4. *Plan* your approach \\
      5. *Comment* your progress
    ]
  ]
)

#page_footer("1", "1")
#pagebreak()

// PAGE 2: PLANNING
#report_header("2")
#section_title("2", "2.0", "Planning Notes")

== Today's Goals
#box(
  width: 100%,
  height: 150pt,
  inset: 15pt,
  fill: muted_bg.lighten(50%),
  radius: 4pt,
  stroke: 1pt + gray.lighten(60%),
  [
    #text(size: 9pt, fill: gray, style: "italic")[Write your main goals for today here...]
  ]
)

== Time Blocks
#table(
  columns: (auto, 1fr),
  inset: 8pt,
  stroke: 0.5pt + gray.lighten(50%),
  fill: (x, y) => if calc.even(y) { muted_bg.lighten(50%) },
  [*Time*], [*Plan*],
  [09:00-10:00], [],
  [10:00-11:00], [],
  [11:00-12:00], [],
  [12:00-13:00], [Lunch Break],
  [13:00-14:00], [],
  [14:00-15:00], [],
  [15:00-16:00], [],
  [16:00-17:00], [],
)

